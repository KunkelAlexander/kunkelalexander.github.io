<section class="project-showcase">
  <h2 id="{{ include.id }}">{{ include.title }}</h2>

  {% if include.subtitle %}
    <p class="showcase-subtitle">{{ include.subtitle }}</p>
  {% endif %}

  <ul class="project-list">
    {% assign items = site.data[include.data] %}

    {% for item in items %}
      <li
        data-title="{{ item.title | escape }}"
        data-text="{{ item.text | escape }}"
        data-url="{{ item.url | relative_url }}"
        data-image="{{ item.image | relative_url }}"
      >
        {% if item.date %}{{ item.date }} – {% endif %}
        <a href="{{ item.url | relative_url }}">
          {{ item.title }}{% if item.text %} - {{ item.text }}{% endif %}
        </a>
      </li>
    {% endfor %}
  </ul>
</section>
